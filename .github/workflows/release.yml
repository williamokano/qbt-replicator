name: Release

# Versioning is driven by conventional commits:
#  - every push to main updates (or opens) a release-please "chore(release): x.y.z" PR
#    with the next semantic version and CHANGELOG.md;
#  - merging that PR creates the vX.Y.Z tag + GitHub release, and this same run
#    publishes the binaries (GoReleaser) and the versioned container image.
# Every push to main also publishes ghcr.io/...:latest and :sha-<commit>.
# A manually pushed v* tag, or a manual run with an existing tag, publishes that version.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish binaries and image for, e.g. v0.1.0
        required: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    name: Resolve version
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      main: ${{ steps.tag.outputs.main }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RP_CREATED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag=""
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          elif [ "$RP_CREATED" = true ]; then tag="$RP_TAG"
          fi
          main=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then main=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-<none>}, main build: $main" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  image:
    name: Build & push image
    needs: [plan, test]
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.plan.outputs.tag != '' || needs.plan.outputs.main == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag || github.sha }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.plan.outputs.main == 'true' }}
            type=sha,format=short,prefix=sha-,enable=${{ needs.plan.outputs.main == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=qbt-replicator
            org.opencontainers.image.description=Replicate completed torrents across qBittorrent instances sharing storage

      - name: Build metadata
        id: build
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  goreleaser:
    name: Binaries (GoReleaser)
    needs: [plan, test]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Always use this run's GoReleaser config so older tags (which may predate it)
      # can be (re)published; keep it outside the repo so the checkout stays clean.
      - name: GoReleaser config from ${{ github.sha }}
        run: git show "${GITHUB_SHA}:.goreleaser.yaml" > "${RUNNER_TEMP}/goreleaser.yaml"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.plan.outputs.tag }}
