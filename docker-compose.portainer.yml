# qbt-replicator stack for Portainer (Stacks -> Add stack -> Web editor, or
# Repository with compose path "docker-compose.portainer.yml").
#
# No configuration file is needed: on first start qbt-replicator creates a
# minimal /config/config.yaml (in the named volume below) and starts in setup
# mode. Open http://<nas>:8085/config, add your qBittorrent instances and a
# rule, and click "Save & apply". Changes apply immediately; the file persists
# in the volume across redeploys.
#
# Optional Portainer environment variables:
#   QBTR_PORT       host port for the web UI (default 8085)
#   TZ              time zone (default Etc/UTC)
#   QBT1_PASSWORD…  any variable you add here can be referenced in the config
#                   editor as ${QBT1_PASSWORD}, keeping secrets out of the file.

services:
  qbt-replicator:
    image: ghcr.io/williamokano/qbt-replicator:latest
    container_name: qbt-replicator
    restart: unless-stopped
    ports:
      - "${QBTR_PORT:-8085}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Uncomment to keep WebUI passwords out of the config file
      # (reference them in the editor as ${QBT1_PASSWORD}, ...):
      # QBT1_PASSWORD: ${QBT1_PASSWORD}
      # QBT2_PASSWORD: ${QBT2_PASSWORD}
      # QBT3_PASSWORD: ${QBT3_PASSWORD}
    volumes:
      - qbtr_config:/config   # config.yaml, config.yaml.bak, state.json
    # If your qBittorrent/gluetun containers are on a user-defined network and you
    # want to reach them by container name (http://gluetun-1:8080), join it:
    # networks: [qbt]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  qbtr_config:

