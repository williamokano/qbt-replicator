# qbt-replicator configuration.
#
# Location (first match wins): --config/-c flag, $QBTR_CONFIG,
# /config/config.yaml (Docker default), ./config.yaml.
#
# ${VAR} references in values are expanded from the environment.
# Scalar keys can also be overridden with QBTR_<SECTION>_<KEY>, e.g.
# QBTR_LOG_LEVEL=debug or QBTR_DAEMON_DRY_RUN=true.

log:
  level: info          # debug | info | warn | error
  format: text         # text | json

server:
  listen: ":8080"
  base_path: "/"       # set e.g. "/replicator" behind a reverse proxy
  auth:                # basic auth for the UI/API; leave empty to disable
    username: ""
    password: ""

daemon:
  enabled: true        # false (or `serve --no-daemon`) = UI/API only
  interval: 5s         # poll interval (>= 1s); 1s-5s is fine on a LAN
  concurrency: 2       # actions executed in parallel
  dry_run: false       # log what would be done, change nothing
  replica_tag: qbtr-replica   # marks torrents added by qbt-replicator
  orphan_grace_ticks: 2       # passes a replica must be orphaned before removal
  orphan_grace_period: 1m     # ...and for at least this long
  exclude_tag: qbtr-exclude   # source torrents with this tag are never replicated

instances:
  - name: qbt-1
    url: http://gluetun-1:8080
    username: admin
    password: ${QBT1_PASSWORD}
    # password_file: /run/secrets/qbt1_password
    # Or, on qBittorrent 5.2+, an API key (Options > WebUI) instead of username/password:
    # api_key: ${QBT1_API_KEY}        # or api_key_file: /run/secrets/qbt1_api_key
    # insecure_skip_verify: false
    # timeout: 15s
    # Only needed if the containers mount the shared storage at different paths:
    # path_mappings:
    #   - { instance: /downloads, canonical: /data/downloads }
    # Only for qBittorrent < 4.5 (no /torrents/export): mount its BT_backup dir here.
    # export_fallback_dir: /bt_backup/qbt-1
  - name: qbt-2
    url: http://gluetun-2:8080
    username: admin
    password: ${QBT2_PASSWORD}
  - name: qbt-3
    url: http://gluetun-3:8080
    username: admin
    password: ${QBT3_PASSWORD}

rules:
  - name: master-to-all
    sources: [qbt-1]   # ["*"] = any instance (mesh); replicas are never sources
    targets: ["*"]     # "*" = every instance except the source
    settle_delay: 2m   # wait after completion (moves from incomplete dir, *arr imports)
    filter:
      categories: []   # empty = any category
      tags: []         # torrent must have at least one of these (empty = any)
      exclude_tags: [no-replicate]
      trackers: []     # substring match on the current tracker URL
      # WARNING: many private trackers forbid seeding one account from several IPs.
      include_private: false
      min_size: 0      # e.g. 500MiB, 1GB
      min_ratio: 0
      name_regex: ""           # e.g. '(?i)S\d{2}E\d{2}'
      exclude_name_regex: ""   # e.g. '(?i)\bsample\b'
      save_paths: []           # e.g. [/data/tv]
    add:
      category: inherit   # inherit | "" (none) | explicit category name
      extra_tags: []
      skip_checking: true # source is verified complete; false = recheck on each target
      start: true         # false = add replicas stopped
    remove_orphans: true     # remove replicas when the source torrent is gone (files kept)
    follow_relocation: true  # re-add replicas when the source moves its files
    sync_share_limits: false # mirror ratio/seeding-time limits from the source
