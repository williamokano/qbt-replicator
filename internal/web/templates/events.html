{{define "content"}}
<h2>Activity</h2>
<form method="get" class="filters">
  <select name="level" aria-label="Level">
    <option value="">All levels</option>
    {{range list4 "info" "warn" "error" ""}}{{if .}}<option {{if eq . $.Filter.Level}}selected{{end}}>{{.}}</option>{{end}}{{end}}
  </select>
  <select name="instance" aria-label="Instance">
    <option value="">All instances</option>
    {{range .Instances}}<option {{if eq . $.Filter.Instance}}selected{{end}}>{{.}}</option>{{end}}
  </select>
  {{if .Filter.Hash}}<input type="hidden" name="hash" value="{{.Filter.Hash}}"><span class="badge">torrent <code>{{short .Filter.Hash}}</code></span>{{end}}
  <button type="submit">Filter</button>
  {{if or .Filter.Level .Filter.Instance .Filter.Hash .Filter.BeforeID}}<a href="{{url "events"}}">Clear</a>{{end}}
</form>
{{template "eventtable" .Events}}
{{if .Older}}<p><a href="{{.Older}}">Older →</a></p>{{end}}
{{end}}
